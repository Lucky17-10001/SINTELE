<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login.css">
    <link rel="icon" type="image/ico" href="sintele.ico">
    <title>LOGIN - ALUNO</title>
</head>
<body>
    <main class="container">
        <h1>LOGIN</h1>

        <div class="login">
            <form id="login-aluno">

                <input type="text" id="nome"
                    placeholder="Digite seu nome" required>

                <input type="email" id="email"
                    placeholder="Digite seu e-mail" required>

                <input type="password" id="senha"
                    placeholder="Digite sua senha" required>

                <label for="sala">Selecione a sua sala</label>

                <select name="sala" id="sala" required>
                    <option value="2A">2°A</option>
                    <option value="2B">2°B</option>
                    <option value="3A">3°A</option>
                    <option value="3B">3°B</option>
                </select>

                <a class="cadastro" href="cadastro.html">
                    Criar uma conta
                </a>

                <div class="botoes">
                    <button type="reset" id="btnLimpar">Limpar</button>
                    <button type="submit" id="btnEnviar">Entrar</button>
                    <br>
                    <a class="prof" href="loginprof.html">Sou professor</a>
                </div>

            </form>
        </div>
    </main>

    <script src="login.js"></script>
</body>
</html>
